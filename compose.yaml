services:
  db:
    image: postgres:17-alpine
    container_name: fest-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: chandanyadav15/fest-backend:1.0.0
    container_name: fest-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "169:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-backend
      - backend-db

  frontend:
    image: nginx:1.30-alpine
    container_name: fest-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - frontend-backend

volumes:
  postgres-data:

networks:
  frontend-backend:
    driver: bridge
  backend-db:
    driver: bridge